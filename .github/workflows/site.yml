name: Vérifier et publier le site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Compilation et vérifications
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUPPETEER_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Installer les dépendances
        run: |
          npm ci
          npm run browser:install
      - name: Compiler et contrôler les fichiers publiés
        run: |
          npm run build
          npm run check:generated
          npm run check:repo
      - name: Vérifier le nombre de pages du PDF public
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          test "$(pdfinfo static/memoire-communs-numeriques-berge-2025.pdf | awk '/^Pages:/ {print $2}')" = 124
          cmp static/memoire-communs-numeriques-berge-2025.pdf docs/memoire-communs-numeriques-berge-2025.pdf
      - name: Vérifier dans le navigateur
        shell: bash
        run: |
          python3 -m http.server 8900 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/site-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8900/ > /dev/null; then break; fi
            sleep 0.5
          done
          curl --fail --silent http://127.0.0.1:8900/ > /dev/null
          npm run verify
      - name: Préparer le site validé
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'ElegArtech/communs-numeriques'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs

  deploy:
    name: Publication GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.repository == 'ElegArtech/communs-numeriques'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
